thehollow.bismuthmine = Нажмите, чтобы добыть :ectotech-bismuth: [accent]висмут[] из стен.
thehollow.graphitemine = Нажмите, чтобы добыть :graphite: [accent]графит[] из стен.
thehollow.coreproximityweaponhint = Когда вы вылетаете за пределы радиуса защиты ядра,\nорудия вашей боевой единицы автоматически отключаются.
thehollow.geyserturbine = Откройте :tree: дерево исследований.\nИсследуйте, затем поставьте :ectotech-geyser-turbine: [accent]гейзерную турбину[] на гейзер.\nОна будет производить [accent]энергию[].
thehollow.impulsebore = Исследуйте и поставьте :ectotech-impulse-bore: [accent]импульсный бур[].\nОн будет автоматически добывать ресурсы из стен.
thehollow.powertransmitter = Чтобы [accent]подключить[] импульсный бур, исследуйте и поставьте :ectotech-power-transmitter: [accent]энергопередатчик[].\nОн поддерживает октогональное соединение.\n\nПодключите импульсный бур к энергосети.
thehollow.pneumaticduct =  Исследуйте и поставьте :ectotech-pneumatic-duct: [accent]пневмоканалы[] для перевозки ресурсов из бура в ядро.\nПеретаскивайте для установки нескольких каналов.\n[accent]Вращайте колёсико мыши[] для поворота.
thehollow.expansion = Для добычи [accent]цинка[] необходимо исследовать [accent]туман войны[].\nИзучите и поставьте :ectotech-radar-device: [accent]радарную установку[].\n\nЕё дополнительный радиус будет [accent]подсвечивать[] врагов для вас.
thehollow.zincmine = Нажмите, чтобы добыть :ectotech-zinc: [accent]цинк[] из стен.
thehollow.sentinel = Для [accent]защиты ядра[] от вражеских атак вам понадобится турель :ectotech-sentinel: [accent]страж[].\nИсследуйте её. Найдите [accent]оптимальное место[] для её размещения.
thehollow.zincbatteryhint = Для стабилизации энергосети вы можете изучить :ectotech-zinc-battery: [accent]цинковые батареи[].\nПроверьте :tree: дерево исследований.

